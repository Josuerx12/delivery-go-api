services:
  pgsql:
    image: postgres:15-alpine
    container_name: delivery-go-api-postgres
    environment:
      POSTGRES_USER: api
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: delivery_go_api
    ports:
      - "5445:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: delivery-go-api-redis
    ports:
      - "6383:6379"
volumes:
  postgres-data:
